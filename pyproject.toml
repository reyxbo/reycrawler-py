[project]
name = "reycrawler"
version = "1.0.20"
description = "Method integration package for web crawling."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "rey",
    "reyxbo",
    "crawler",
    "crawl-pages",
    "browser",
    "baidu",
    "douban",
    "sina",
    "toutiao",
    "weibo",
]
authors = [
    {name = "Rey", email = "reyxbo@163.com"}
]
dependencies = [
    "bs4",
    "fake_useragent",
    "reydb",
    "reykit",
    "selenium"
]

[project.urls]
Homepage = "https://www.reyxbo.com/release/python/reycrawler"
Repository = "https://github.com/reyxbo/reycrawler-py.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
